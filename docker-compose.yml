services:
  hermes-agent:
    image: nousresearch/hermes-agent:${SOFTWARE_VERSION_TAG}
    container_name: hermes-agent
    command: gateway run
    restart: always
    ports:
      - "172.17.0.1:8642:8642"
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=10000
      - HERMES_GID=10000
    volumes:
      - ./hermes-home:/home/hermes/.hermes
      - hermes-agent-src:/opt/hermes

  hermes-dashboard:
    image: nousresearch/hermes-agent:${SOFTWARE_VERSION_TAG}
    container_name: hermes-dashboard
    command: dashboard --host 0.0.0.0 --insecure
    restart: always
    ports:
      - "172.17.0.1:9119:9119"
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=10000
      - HERMES_GID=10000
      - GATEWAY_HEALTH_URL=http://hermes-agent:8642
    depends_on:
      - hermes-agent
    volumes:
      - ./hermes-home:/home/hermes/.hermes

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: always
    depends_on:
      - hermes-agent
    ports:
      - "172.17.0.1:8787:8787"
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_PASSWORD=${ADMIN_PASSWORD}
      - WANTED_UID=10000
      - WANTED_GID=10000
    volumes:
      - ./hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent
      - ./workspace:/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null --max-time 3 http://localhost:8787/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# hermes-agent-src is a named Docker volume (NOT a bind mount): the
# nousresearch/hermes-agent image ships its Python source code at /opt/hermes,
# and a bind mount to an empty host directory would mask those files. With a
# named volume Docker auto-copies the container's pre-existing contents on
# first mount, which is exactly what we need so hermes-webui can `uv pip
# install /home/hermeswebui/.hermes/hermes-agent` from the shared volume.
volumes:
  hermes-agent-src:
